<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boggle (solo)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <a class="back-link" href="../../index.html">&larr; All games</a>
    <h1>Boggle (solo)</h1>

    <div class="controls top-controls">
      <button id="start" type="button">Start round</button>
      <button id="new-board" type="button" class="secondary">New board</button>
    </div>

    <div class="scorebar">
      <div class="stat"><span class="label">Time</span><span id="timer" class="value">3:00</span></div>
      <div class="stat"><span class="label">Score</span><span id="score" class="value">0</span></div>
      <div class="stat"><span class="label">Words</span><span id="count" class="value">0</span></div>
    </div>

    <div id="board" class="board" role="grid" aria-label="Boggle board"></div>

    <form id="word-form" class="word-form" autocomplete="off">
      <div id="type-panel">
        <label for="word-input">Type a word</label>
        <input id="word-input" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="16" disabled />
      </div>
      <div id="tap-panel" hidden>
        <span class="label-text">Tap touching tiles to build a word</span>
        <div id="tap-word" class="tap-word" aria-live="polite"></div>
      </div>
      <div class="word-row">
        <button id="clear" type="button" class="secondary" hidden disabled>Clear</button>
        <button id="submit" type="submit" disabled>Enter</button>
      </div>
    </form>

    <p id="status" class="status" aria-live="polite">Press Start round, then type or tap words you can trace through touching letters.</p>

    <div class="mode bottom-mode" role="group" aria-label="How to enter words">
      <span class="mode-label">Enter words by</span>
      <button id="mode-tap" type="button" class="mode-btn" aria-pressed="true">Tapping</button>
      <button id="mode-type" type="button" class="mode-btn" aria-pressed="false">Typing</button>
    </div>

    <section id="found-section" class="panel" hidden>
      <h2>Your words</h2>
      <ul id="found" class="word-list"></ul>
    </section>

    <section id="missed-section" class="panel" hidden>
      <h2>Words you missed</h2>
      <p id="missed-summary" class="summary"></p>
      <ul id="missed" class="word-list"></ul>
    </section>
  </main>

  <script src="boggle-core.js"></script>
  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
